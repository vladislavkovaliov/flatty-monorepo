[project]
name = "python-agent"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.3,<4",
    "python-dotenv>=1.0",
    "mcp>=2.0,<3",
    "ollama>=0.4,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.54,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
# markdown только документация — не форматировать code blocks в доках/плане
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
# namespace packages без __init__.py: явные базы, чтобы не было дублей имён модулей
mypy_path = "."
explicit_package_bases = true
