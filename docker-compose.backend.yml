# Backend-only stack (go-api + nest-graphql) with infrastructure.
#
# Uses host networking as a portable fallback (works even without pasta/tun).
# On hosts where pasta works, prefer docker-compose.yml (bridge network + service DNS).
# Start:  podman-compose -f docker-compose.backend.yml --env-file .env.dev up -d
services:
  postgres:
    image: postgres:16
    network_mode: host
    command: ["-c", "port=55000"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-flatty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 55000"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  init-db:
    image: postgres:16
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: localhost
      PGPORT: "55000"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-flatty}
    volumes:
      - ./db.sql:/db.sql:ro
      - ./scripts/init-db.sh:/init-db.sh:ro
      - ./apps/go-api/migrations:/migrations:ro
    command: sh /init-db.sh
    restart: "no"

  # Runs after nest-graphql has created the better-auth schema (the "user" table).
  init-db-auth:
    image: postgres:16
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      nest-graphql:
        condition: service_healthy
    environment:
      POSTGRES_HOST: localhost
      PGPORT: "55000"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-flatty}
    volumes:
      - ./scripts/init-db-auth.sh:/init-db-auth.sh:ro
      - ./apps/go-api/migrations:/migrations:ro
    command: sh /init-db-auth.sh
    restart: "no"

  redpanda:
    image: docker.io/redpandadata/redpanda:latest
    network_mode: host
    command:
      - redpanda start --mode dev-container --smp 1 --advertise-kafka-addr localhost:9092
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M

  rabbitmq:
    image: rabbitmq:4-management
    network_mode: host
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 192M

  go-api:
    build:
      context: .
      dockerfile: apps/go-api/Dockerfile
    network_mode: host
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:password@localhost:55000/flatty?sslmode=disable
      KAFKA_BROKERS: localhost:9092
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      AUTH_SERVICE_URL: http://localhost:3000
      OTEL_SDK_DISABLED: "true"
    depends_on:
      - postgres
      - redpanda
      - rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  nest-graphql:
    build:
      context: .
      dockerfile: apps/nest-graphql/Dockerfile
    network_mode: host
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://postgres:password@localhost:55000/flatty
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-random-secret-at-least-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:80}
      NODE_OPTIONS: "--require ./dist/instrumentation.js --max-old-space-size=320"
      OTEL_SDK_DISABLED: "true"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/config || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 256M

volumes:
  pgdata:
