global:
  scrape_interval: 5s

scrape_configs:
  - job_name: go-api
    metrics_path: /metrics
    static_configs:
      - targets: ["go-api:8080"]
        labels:
          service: go-api

  - job_name: nest-graphql
    metrics_path: /metrics
    static_configs:
      - targets: ["nest-graphql:3000"]
        labels:
          service: nest-graphql
