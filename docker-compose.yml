services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-flatty}
    ports: ["55000:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  init-db:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-flatty}
    volumes:
      - ./db.sql:/db.sql:ro
      - ./scripts/init-db.sh:/init-db.sh:ro
      - ./apps/go-api/migrations:/migrations:ro
    command: sh /init-db.sh
    restart: "no"

  # Runs after nest-graphql has created the better-auth schema (the "user" table).
  init-db-auth:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
      nest-graphql:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-flatty}
    volumes:
      - ./scripts/init-db-auth.sh:/init-db-auth.sh:ro
      - ./apps/go-api/migrations:/migrations:ro
    command: sh /init-db-auth.sh
    restart: "no"

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    ports: ["9092:9092", "18081:8081"]
    command:
      - redpanda start --mode dev-container --smp 1 --advertise-kafka-addr redpanda:9092
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          memory: 192M

  react-launcher:
    build:
      context: .
      dockerfile: apps/react-launcher/Dockerfile
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  react-entrypoint:
    build:
      context: .
      dockerfile: apps/react-entrypoint/Dockerfile
      args:
        GO_API_ORIGIN: http://go-api:8080
        NEST_ORIGIN: http://nest-graphql:3000
        SETTINGS_ORIGIN: http://react-settings:80
        RESIDENT_ORIGIN: http://react-resident:80
        VUE_TORRENT_BOT_ORIGIN: http://vue-torrent-bot:80
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/flatty
      GO_API_ORIGIN: http://go-api:8080
      NEST_ORIGIN: http://nest-graphql:3000
      SETTINGS_ORIGIN: http://react-settings:80
      RESIDENT_ORIGIN: http://react-resident:80
      VUE_TORRENT_BOT_ORIGIN: http://vue-torrent-bot:80
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-random-secret-at-least-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:80}
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  react-settings:
    build:
      context: .
      dockerfile: apps/react-settings/Dockerfile
    ports: ["8081:80"]
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  react-resident:
    build:
      context: .
      dockerfile: apps/react-resident/Dockerfile
      args:
        PUBLIC_PROTOCOL: ${RESIDENT_PUBLIC_PROTOCOL:-http}
        PUBLIC_URL: ${RESIDENT_PUBLIC_URL:-localhost}
        PUBLIC_PORT: ${RESIDENT_PUBLIC_PORT:-80}
        PUBLIC_PATH: ${RESIDENT_PUBLIC_PATH:-api/swagger/doc.json}
    ports: ["8082:80"]
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  vue-torrent-bot:
    build:
      context: .
      dockerfile: apps/vue-torrent-bot/Dockerfile
    ports: ["8084:80"]
    depends_on:
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  go-api:
    build:
      context: .
      dockerfile: apps/go-api/Dockerfile
    environment:
      PORT: ${GOAPI_PORT:-8080}
      DATABASE_URL: ${GOAPI_DATABASE_URL:-postgres://postgres:password@postgres:5432/flatty?sslmode=disable}
      KAFKA_BROKERS: ${GOAPI_KAFKA_BROKERS:-redpanda:9092}
      RABBITMQ_URL: ${GOAPI_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      AUTH_SERVICE_URL: ${GOAPI_AUTH_SERVICE_URL:-http://nest-graphql:3000}
      OTEL_SERVICE_NAME: go-api
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      init-db:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 128M

  nest-graphql:
    build:
      context: .
      dockerfile: apps/nest-graphql/Dockerfile
    environment:
      PORT: ${NEST_PORT:-3000}
      DATABASE_URL: ${NEST_DATABASE_URL:-postgres://postgres:password@postgres:5432/flatty}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-random-secret-at-least-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:80}
      OTEL_SERVICE_NAME: nest-graphql
      OTEL_EXPORTER_OTLP_PROTOCOL: http/json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      init-db:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/config || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 256M

  # api-whisperer:
  #   build:
  #     context: tools/api-whisperer
  #     dockerfile: Dockerfile
  #   volumes:
  #     - ./tools/api-whisperer/bin:/out
  #   command: cp /api-whisperer /out/
  #   restart: no

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  nginx-proxy:
    build:
      context: .
      dockerfile: apps/nginx-proxy/Dockerfile
    ports: ["80:80"]
    depends_on:
      - react-launcher
      - react-entrypoint
      - react-settings
      - react-resident
      - vue-torrent-bot
      - go-api
      - nest-graphql
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./tools/load-test/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./tools/load-test/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # On-demand k6 runner. Started explicitly with:
  #   podman-compose --profile load-test run --rm k6 run /scripts/smoke.js
  k6:
    image: grafana/k6:latest
    profiles: ["load-test"]
    working_dir: /scripts
    environment:
      K6_BASE_URL: ${K6_BASE_URL:-http://nginx-proxy}
      K6_EMAIL: ${K6_EMAIL:-loadtest@flatty.local}
      K6_PASSWORD: ${K6_PASSWORD:-LoadTest123!}
      K6_RESIDENT_LOCATION_ID: ${K6_RESIDENT_LOCATION_ID:-9}
      K6_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99)
    volumes:
      - ./tools/load-test:/scripts
    depends_on:
      - prometheus
      - jaeger
      - nginx-proxy
    restart: "no"

volumes:
  pgdata:
