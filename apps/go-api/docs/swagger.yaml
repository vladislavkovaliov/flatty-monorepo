info:
  contact: {}
  description: TBD
  title: GO API
  version: "1.0"
paths:
  /applications:
    get:
      description: 'Returns the micro-frontend registry for the environment selected
        by APP_ENV. Public (unauthenticated): shells and the entrypoint boot fetch
        rely on it.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListApplicationResponse'
      summary: List applications for the current APP_ENV
      tags:
      - applications
    post:
      consumes:
      - application/json
      description: Add a new application entry to the registry
      parameters:
      - description: Application data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ApplicationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create an application registry row
      tags:
      - applications
  /applications/{id}:
    delete:
      description: Remove an application entry from the registry
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeleteApplicationResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an application registry row
      tags:
      - applications
    put:
      consumes:
      - application/json
      description: Update an existing application entry
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: integer
      - description: Application data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ApplicationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an application registry row
      tags:
      - applications
  /categories:
    get:
      description: Returns all categories from the database
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of products to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListCategoryResponse'
      summary: List all categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Add a new category to the database
      parameters:
      - description: Category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a category
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a category to the database
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.DeleteCategoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a category
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update a category to the database
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a category
      tags:
      - categories
  /categories/count:
    get:
      description: Returns count categories from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CountResponse'
      summary: Count all categories
      tags:
      - categories
  /expenses:
    get:
      description: Returns all expenses from the database
      parameters:
      - description: Resident location ID
        in: query
        name: residentLocationId
        type: integer
      - description: Number of items to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of items to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListExpenseResponse'
      summary: List all expenses
      tags:
      - expenses
    post:
      consumes:
      - application/json
      description: Add a new expense to the database
      parameters:
      - description: Expense data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ExpenseResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create an expense
      tags:
      - expenses
  /expenses/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an expense from the database
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DeleteExpenseResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an expense
      tags:
      - expenses
    put:
      consumes:
      - application/json
      description: Update an expense in the database
      parameters:
      - description: Expense ID
        in: path
        name: id
        required: true
        type: integer
      - description: Expense data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ExpenseResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an expense
      tags:
      - expenses
  /expenses/count:
    get:
      description: Returns count of expenses from the database
      parameters:
      - description: Resident location ID
        in: query
        name: residentLocationId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CountResponse'
      summary: Count all expenses
      tags:
      - expenses
  /expenses/stats/averages:
    get:
      description: Returns monthly expense averages for a resident location owned
        by the caller, optionally filtered by month/year
      parameters:
      - description: Resident Location ID
        in: query
        name: residentLocationId
        required: true
        type: integer
      - description: Month (1-12)
        in: query
        name: month
        type: integer
      - description: Year (2000+)
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListMonthlyAverageResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List monthly averages
      tags:
      - expense-stats
  /expenses/stats/totals:
    get:
      description: Returns monthly expense totals for a resident location owned by
        the caller, optionally filtered by month/year
      parameters:
      - description: Resident Location ID
        in: query
        name: residentLocationId
        required: true
        type: integer
      - description: Month (1-12)
        in: query
        name: month
        type: integer
      - description: Year (2000+)
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListMonthlyTotalResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List monthly totals
      tags:
      - expense-stats
  /health:
    get:
      description: Returns health check status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Information about health status
      tags:
      - health
  /resident-location:
    get:
      description: Returns all resident location from the database
      parameters:
      - description: Number of products to return (default 10)
        in: query
        name: limit
        type: integer
      - description: Number of products to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ListResidentLocationResponse'
      summary: List all resident location
      tags:
      - resident_location
    post:
      consumes:
      - application/json
      description: Add a new resident location to the database
      parameters:
      - description: Resident Location data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateResidentLocationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
