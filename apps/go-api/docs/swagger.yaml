  /user/me/settings:
    get:
      description: 'Returns the authenticated user''s settings. If no settings have
        been saved yet, returns sensible defaults (language: en, theme: system, timezone:
        UTC, date_format: YYYY-MM-DD).'
      responses:
        "200":
          description: OK
