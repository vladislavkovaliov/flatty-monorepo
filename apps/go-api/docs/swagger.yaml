        in: path
        name: id
        required: true
        type: integer
      - description: Resident Location data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateResidentLocationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
